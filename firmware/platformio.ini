; PlatformIO Project Configuration File
; Smart Grain Storage IoT - ESP32 Firmware (TCVN 8370:2018)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Tự động tải các thư viện cần thiết khi build
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.1
    adafruit/Adafruit AHTX0 @ ^2.0.5
